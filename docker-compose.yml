services:
  # 1. Database: Cấu hình đúng user/pass của bạn
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=00000000
      - POSTGRES_DB=ggflight
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Airflow Webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
    environment:
      # Chuỗi kết nối: postgresql+psycopg2://user:password@host/db_name
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://user:00000000@postgres/ggflight
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
    depends_on:
      - postgres

  # 3. Airflow Scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: scheduler
    environment:
      # Phải khớp y hệt chuỗi kết nối của Webserver
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://user:00000000@postgres/ggflight
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
    depends_on:
      - postgres

volumes:
  postgres_data: