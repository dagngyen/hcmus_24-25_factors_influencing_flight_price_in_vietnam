version: '3.8'

# Định nghĩa các cấu hình chung cho các service của Airflow để tránh lặp lại code
x-airflow-common: &x-airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file:
    - .env
  environment:
    &airflow-common-env
    TZ: Asia/Ho_Chi_Minh
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Quan trọng: Thêm đường dẫn /opt/airflow (nơi mount code) vào PYTHONPATH
    # để Airflow có thể import được folder "src"
    PYTHONPATH: /opt/airflow
    SELENIUM_HOST: "selenium"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Ho_Chi_Minh"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src        # Mount source code logic
    - ./data:/opt/airflow/data      # Mount folder data để lưu/đọc file CSV/JSON
    - ./logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:13
    container_name: flight_postgres
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Dữ liệu DB sẽ bền vững (không mất khi tắt container)
      - postgres-db-volume:/var/lib/postgresql/data
      # Tự động chạy script init.sql khi khởi tạo lần đầu
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: flight_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  # 2. Selenium Standalone Chrome (Dùng cho quá trình Extract)
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: flight_selenium
    environment:
      TZ: Asia/Ho_Chi_Minh
    # Tăng bộ nhớ share để trình duyệt không bị crash khi load trang nặng
    shm_size: 2g
    ports:
      - "4444:4444" # Port để code python connect vào
      - "7900:7900" # Port để xem màn hình browser qua web (nếu cần debug)
    restart: always

  # 3. Airflow Init (Chạy 1 lần để khởi tạo DB cho Airflow)
  airflow-init:
    <<: *x-airflow-common
    container_name: flight_airflow_init
    command: version
    environment:
      <<: *airflow-common-env
      TZ: Asia/Ho_Chi_Minh
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Airflow Webserver (Giao diện quản lý)
  airflow-webserver:
    <<: *x-airflow-common
    container_name: flight_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 5. Airflow Scheduler (Bộ não điều phối task)
  airflow-scheduler:
    <<: *x-airflow-common
    container_name: flight_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume: